<style>
/* ═══════════════════════════════════════
   NITIZEN — Shared CSS
═══════════════════════════════════════ */
/* ═══════════════════════════════════════
   NITIZEN — shared.css
   Civic Intelligence for a New Nigeria
═══════════════════════════════════════ */

:root {
  --green-deep:  #1a4d2e;
  --green-mid:   #2d7a4f;
  --green-soft:  #4aaf74;
  --green-light: #a8d5b5;
  --green-mist:  #e8f5ee;
  --white:       #ffffff;
  --off-white:   #f7faf8;
  --ink:         #0f1f16;
  --ink-light:   #2c4033;
  --muted:       #6b8f76;
  --gold:        #c8a84b;
  --gold-light:  #f0dfa0;
  --border:      rgba(45,122,79,0.18);

  --display: 'EB Garamond', Georgia, serif;
  --body:    'Average', Georgia, serif;
  --mono:    'Space Mono', 'Courier New', monospace;
  --accent:  'Sakkal Majalla', 'EB Garamond', serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; overflow-x: hidden; }
body {
  font-family: var(--body);
  background: var(--off-white);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0; opacity: 0.3;
}

/* ── SKIP LINK ── */
.skip-link {
  position: absolute; top: -100px; left: 1rem;
  background: var(--green-deep); color: #fff;
  padding: .5rem 1rem; font-family: var(--mono); font-size: .8rem;
  border-radius: 2px; z-index: 999; text-decoration: none;
  transition: top .2s;
}
.skip-link:focus { top: 1rem; }

/* ── NAV ── */
nav#main-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 4rem;
  background: rgba(247,250,248,.96);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  transition: padding .3s, box-shadow .3s;
}
nav#main-nav.scrolled {
  padding: .65rem 4rem;
  box-shadow: 0 2px 24px rgba(26,77,46,.09);
}
.nav-logo {
  font-family: var(--mono); font-weight: 700; font-size: 1.2rem;
  color: var(--green-deep); letter-spacing: .14em; text-decoration: none;
}
.nav-logo span { color: var(--green-soft); }
.nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }
.nav-links a {
  font-family: var(--mono); font-size: .68rem;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-light); text-decoration: none; transition: color .2s;
  position: relative; padding-bottom: 2px;
}
.nav-links a::after {
  content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
  height: 1px; background: var(--green-soft);
  transform: scaleX(0); transform-origin: left; transition: transform .2s;
}
.nav-links a:hover, .nav-links a.active { color: var(--green-mid); }
.nav-links a:hover::after, .nav-links a.active::after { transform: scaleX(1); }
.nav-cta {
  background: var(--green-deep) !important;
  color: #fff !important;
  padding: .45rem 1.1rem; border-radius: 2px;
  transition: background .2s !important;
}
.nav-cta:hover { background: var(--green-mid) !important; }
.nav-cta::after { display: none !important; }

.nav-toggle {
  display: none; flex-direction: column; gap: 5px;
  cursor: pointer; background: none; border: none; padding: 4px;
}
.nav-toggle span {
  display: block; width: 22px; height: 2px;
  background: var(--green-deep); border-radius: 2px;
  transition: transform .25s, opacity .25s;
}
.nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-toggle.open span:nth-child(2) { opacity: 0; }
.nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.mobile-menu {
  display: none;
  position: fixed; top: 56px; left: 0; right: 0;
  background: rgba(247,250,248,.99);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 1.5rem 2rem; z-index: 99;
  flex-direction: column; gap: 1rem;
}
.mobile-menu.open { display: flex; }
.mobile-menu a {
  font-family: var(--mono); font-size: .78rem;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-light); text-decoration: none;
  padding: .5rem 0; border-bottom: 1px solid var(--border);
}
.mobile-menu a:last-child { border-bottom: none; }

/* ── TICKER ── */
.ticker-wrap { background: var(--green-deep); overflow: hidden; padding: .55rem 0; }
.ticker {
  display: flex; gap: 3rem;
  animation: ticker 38s linear infinite;
  white-space: nowrap;
}
.ticker span {
  font-family: var(--mono); font-size: .68rem;
  color: var(--green-light); letter-spacing: .09em; text-transform: uppercase;
}
.ticker span::before { content: '◆'; margin-right: 1rem; color: var(--green-soft); }

/* ── FOOTER ── */
footer {
  background: var(--ink); color: rgba(255,255,255,.4);
  padding: 2.5rem 4rem;
  display: flex; justify-content: space-between;
  align-items: center; flex-wrap: wrap; gap: 1rem;
}
.footer-logo {
  font-family: var(--mono); font-weight: 700; font-size: 1rem;
  color: #fff; letter-spacing: .13em;
}
.footer-logo span { color: var(--green-soft); }
footer p { font-family: var(--mono); font-size: .7rem; }
.footer-links { display: flex; gap: 1.8rem; flex-wrap: wrap; }
.footer-links a {
  font-family: var(--mono); font-size: .7rem;
  color: rgba(255,255,255,.38); text-decoration: none;
  transition: color .2s; letter-spacing: .06em;
}
.footer-links a:hover { color: var(--green-light); }

/* ── COMMON ELEMENTS ── */
.section-label {
  font-family: var(--mono); font-size: .66rem;
  letter-spacing: .22em; text-transform: uppercase;
  color: var(--green-soft); margin-bottom: .9rem;
}
.section-title {
  font-family: var(--display);
  font-size: clamp(1.85rem, 3.8vw, 2.8rem);
  font-weight: 700; line-height: 1.15;
  color: var(--green-deep); max-width: 620px;
}
.section-title em { font-style: italic; color: var(--green-mid); }

.btn-primary {
  background: var(--green-deep); color: #fff;
  padding: .82rem 1.85rem;
  font-family: var(--mono); font-size: .74rem;
  font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  border: none; cursor: pointer; text-decoration: none;
  display: inline-block; border-radius: 2px;
  transition: background .2s, transform .15s;
}
.btn-primary:hover { background: var(--green-mid); transform: translateY(-1px); }

.btn-outline {
  background: transparent; color: var(--green-deep);
  padding: .82rem 1.85rem;
  font-family: var(--mono); font-size: .74rem;
  font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  border: 1.5px solid var(--green-deep); cursor: pointer;
  text-decoration: none; display: inline-block; border-radius: 2px;
  transition: all .2s;
}
.btn-outline:hover { background: var(--green-mist); }

.btn-ghost {
  background: transparent; color: var(--green-light);
  padding: .82rem 1.85rem;
  font-family: var(--mono); font-size: .74rem;
  font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  border: 1.5px solid rgba(168,213,181,.4); cursor: pointer;
  text-decoration: none; display: inline-block; border-radius: 2px;
  transition: all .2s;
}
.btn-ghost:hover { border-color: var(--green-light); background: rgba(168,213,181,.08); }

.wa-btn {
  display: inline-flex; align-items: center; gap: .8rem;
  background: #25D366; color: #fff;
  padding: .95rem 2rem;
  font-family: var(--mono); font-size: .76rem; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
  border-radius: 2px; text-decoration: none;
  transition: background .2s, transform .15s; white-space: nowrap;
}
.wa-btn:hover { background: #1ebe5d; transform: translateY(-2px); }

.page-header {
  padding: 7rem 4rem 4rem;
  border-bottom: 1px solid var(--border);
}
.page-header-dark {
  padding: 7rem 4rem 4rem;
  background: var(--green-deep);
}
.page-header-ink {
  padding: 7rem 4rem 4rem;
  background: var(--ink);
}

.pillar-card {
  border: 1px solid var(--border);
  border-left: 3px solid var(--green-soft);
  padding: 1.4rem 1.7rem;
  background: var(--off-white); border-radius: 2px;
  margin-bottom: 1.2rem;
  transition: transform .2s, box-shadow .2s;
}
.pillar-card:hover { transform: translateX(4px); box-shadow: -4px 4px 20px rgba(26,77,46,.08); }
.pillar-card h4 {
  font-family: var(--mono); font-size: .7rem;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--green-deep); margin-bottom: .4rem;
}
.pillar-card p {
  font-family: var(--body); font-size: .92rem; line-height: 1.72; color: var(--muted);
}

.article-cat {
  font-family: var(--mono); font-size: .6rem;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--green-soft); margin-bottom: .7rem;
}
.cl-tag {
  display: inline-block; background: var(--green-mist);
  color: var(--green-deep); font-family: var(--mono); font-size: .58rem;
  letter-spacing: .1em; text-transform: uppercase;
  padding: .28rem .65rem; border-radius: 2px; margin-right: .4rem;
}

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes ticker {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.reveal {
  opacity: 0; transform: translateY(22px);
  transition: opacity .65s ease, transform .65s ease;
}
.reveal.visible { opacity: 1; transform: translateY(0); }

/* ── BREADCRUMB ── */
.breadcrumb {
  display: flex; align-items: center; gap: .5rem;
  font-family: var(--mono); font-size: .64rem;
  letter-spacing: .08em; text-transform: uppercase;
  color: rgba(255,255,255,.5); margin-bottom: 1.5rem; flex-wrap: wrap;
}
.breadcrumb a { color: var(--green-light); text-decoration: none; transition: color .2s; }
.breadcrumb a:hover { color: #fff; }
.breadcrumb span { color: rgba(255,255,255,.3); }

.breadcrumb-dark { color: var(--muted); }
.breadcrumb-dark a { color: var(--green-mid); }
.breadcrumb-dark span { color: var(--border); }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  nav#main-nav { padding: 1rem 1.5rem; }
  nav#main-nav.scrolled { padding: .65rem 1.5rem; }
  .nav-links { display: none; }
  .nav-toggle { display: flex; }
  footer { flex-direction: column; text-align: center; padding: 2rem 1.5rem; }
  .page-header, .page-header-dark, .page-header-ink { padding: 6rem 1.5rem 3rem; }
}
@media (max-width: 480px) {
  .btn-primary, .btn-outline { width: 100%; text-align: center; }
}

/* ── NDPC / PRIVACY BADGE ── */
.ndpc-badge {
  display: inline-flex; align-items: center; gap: .5rem;
  background: rgba(74,175,116,.08); border: 1px solid rgba(74,175,116,.25);
  color: var(--green-mid); font-family: var(--mono); font-size: .6rem;
  letter-spacing: .1em; text-transform: uppercase; padding: .3rem .75rem;
  border-radius: 2px; text-decoration: none; transition: background .2s;
}
.ndpc-badge:hover { background: rgba(74,175,116,.15); }
.ndpc-badge::before { content: "🛡️"; font-size: .75rem; }

/* ── SITE-WIDE PRIVACY BAR (bottom) ── */
.site-privacy-bar {
  background: var(--ink); border-top: 1px solid rgba(255,255,255,.06);
  padding: .6rem 4rem; display: flex; align-items: center;
  justify-content: space-between; flex-wrap: wrap; gap: .8rem;
}
.site-privacy-bar p {
  font-family: var(--mono); font-size: .6rem; letter-spacing: .05em;
  color: rgba(255,255,255,.32); line-height: 1.6;
}
.site-privacy-bar a { color: rgba(74,175,116,.7); text-decoration: none; }
.site-privacy-bar a:hover { color: var(--green-light); }

/* ── FORM CONSENT CHECKBOX ── */
.consent-row { display: flex; align-items: flex-start; gap: .8rem; }
.consent-row input[type="checkbox"] {
  width: 16px; height: 16px; min-width: 16px; margin-top: 3px;
  accent-color: var(--green-soft); cursor: pointer;
}
.consent-row label {
  font-family: var(--body); font-size: .82rem; line-height: 1.6;
  color: var(--muted); cursor: pointer;
}
.consent-row label a { color: var(--green-mid); }

/* Dark form consent */
.consent-row-dark label { color: rgba(168,213,181,.7); }
.consent-row-dark label a { color: var(--green-soft); }

@media(max-width:900px) {
  .site-privacy-bar { padding: .6rem 1.5rem; }
}

/* ══════════════════════════════════════════
   NITIZEN — shared.css ADDITIONS v2
   About fix · Footer social · Payment · Images
   ══════════════════════════════════════════ */

/* ── SECTION CONTAINER (consistent max-width + padding) ── */
.section-inner {
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
}
section { padding: 5rem 4rem; }

/* ── ABOUT PAGE FIXES ── */
.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  margin-top: 3rem;
  align-items: start;
  max-width: 1200px;
  margin-left: auto;
  margin-right: auto;
}
.about-body p {
  font-family: var(--body);
  font-size: 1.05rem;
  line-height: 1.9;
  color: var(--ink-light);
  margin-bottom: 1.1rem;
}
.about-body p strong { color: var(--green-deep); font-weight: 600; }

.align-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.4rem;
  margin-top: 2rem;
  max-width: 1200px;
  margin-left: auto;
  margin-right: auto;
}
.align-card {
  padding: 1.7rem;
  border: 1px solid var(--border);
  background: var(--off-white);
  border-radius: 2px;
}
.align-card h4 {
  font-family: var(--display);
  font-size: 1rem;
  font-weight: 600;
  color: var(--green-deep);
  margin-bottom: .5rem;
}
.align-card p {
  font-family: var(--body);
  font-size: .87rem;
  line-height: 1.7;
  color: var(--muted);
}

/* ── ILLUSTRATION / IMAGE BLOCKS ── */
.page-illustration {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  border-radius: 2px;
  display: block;
}
.section-illustration {
  width: 100%;
  max-width: 520px;
  aspect-ratio: 4/3;
  object-fit: cover;
  border-radius: 2px;
  display: block;
}
.illustration-caption {
  font-family: var(--mono);
  font-size: .62rem;
  color: var(--muted);
  letter-spacing: .06em;
  margin-top: .5rem;
  text-align: center;
}
/* SVG Illustrations embedded inline */
.civic-illustration {
  width: 100%;
  height: auto;
  display: block;
}

/* ── FOOTER SOCIAL ICONS ── */
.footer-social {
  display: flex;
  gap: 1rem;
  margin-top: .9rem;
  align-items: center;
}
.footer-social a {
  color: rgba(255,255,255,.35);
  transition: color .2s;
  display: flex;
  align-items: center;
  line-height: 1;
}
.footer-social a:hover { color: var(--green-light); }
.footer-right { text-align: right; }
@media(max-width:900px) { .footer-right { text-align: center; } }

/* ── PAYMENT GATEWAY SECTION ── */
.payment-gateway-section {
  background: var(--off-white);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2rem;
  margin-top: 1.5rem;
}
.payment-gateway-section h4 {
  font-family: var(--display);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--green-deep);
  margin-bottom: .5rem;
}
.payment-gateway-section p {
  font-family: var(--body);
  font-size: .88rem;
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 1.2rem;
}
.payment-methods {
  display: flex;
  gap: .8rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}
.pay-method-btn {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  padding: .65rem 1.2rem;
  border: 1.5px solid var(--border);
  background: #fff;
  border-radius: 2px;
  font-family: var(--mono);
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-light);
  cursor: pointer;
  transition: all .2s;
  text-decoration: none;
}
.pay-method-btn:hover,
.pay-method-btn.active {
  border-color: var(--green-deep);
  background: var(--green-mist);
  color: var(--green-deep);
}
.pay-method-btn.paystack-btn { border-color: rgba(0,195,103,.4); color: #00A76F; }
.pay-method-btn.paystack-btn:hover { background: rgba(0,195,103,.06); border-color: #00A76F; }
.pay-method-btn.bank-btn { border-color: rgba(200,168,75,.4); color: var(--gold); }
.pay-method-btn.bank-btn:hover { background: rgba(200,168,75,.06); border-color: var(--gold); }

.bank-details-box {
  display: none;
  background: #fff;
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  padding: 1.5rem;
  border-radius: 0 2px 2px 0;
  margin-top: 1rem;
}
.bank-details-box.show { display: block; }
.bank-details-box h5 {
  font-family: var(--mono);
  font-size: .66rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: .9rem;
}
.bank-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: .55rem 0;
  border-bottom: 1px solid var(--border);
  font-family: var(--body);
  font-size: .9rem;
}
.bank-row:last-of-type { border-bottom: none; }
.bank-label { color: var(--muted); font-size: .82rem; }
.bank-value { color: var(--green-deep); font-weight: 600; font-family: var(--mono); font-size: .84rem; }
.copy-btn {
  background: var(--green-mist);
  border: 1px solid var(--green-light);
  color: var(--green-mid);
  font-family: var(--mono);
  font-size: .6rem;
  letter-spacing: .08em;
  padding: .2rem .55rem;
  border-radius: 2px;
  cursor: pointer;
  transition: background .2s;
}
.copy-btn:hover { background: var(--green-light); }
.bank-note {
  font-family: var(--body);
  font-size: .8rem;
  color: var(--muted);
  margin-top: 1rem;
  line-height: 1.65;
  padding: .7rem 1rem;
  background: var(--green-mist);
  border-radius: 2px;
}

/* Paystack inline trigger */
.paystack-inline-form {
  display: none;
  flex-direction: column;
  gap: 1rem;
  margin-top: 1rem;
}
.paystack-inline-form.show { display: flex; }
.paystack-inline-form input {
  width: 100%;
  padding: .82rem 1rem;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 2px;
  font-family: var(--body);
  font-size: .95rem;
  color: var(--ink);
  outline: none;
  transition: border-color .2s;
}
.paystack-inline-form input:focus { border-color: #00A76F; }
.btn-paystack {
  background: #00A76F;
  color: #fff;
  padding: .9rem 2rem;
  font-family: var(--mono);
  font-size: .76rem;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  border: none;
  border-radius: 2px;
  cursor: pointer;
  transition: background .2s, transform .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .6rem;
}

/* === contact.html === */

.contact-wrap { max-width: 1200px; margin: 0 auto; padding: 5rem 4rem; }
.contact-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 5rem; }
.contact-form { display: flex; flex-direction: column; gap: 1rem; }
.contact-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.contact-form input:not([type="checkbox"]),
.contact-form textarea,
.contact-form select {
  width: 100%; padding: .85rem 1rem;
  background: var(--off-white); border: 1px solid var(--border);
  color: var(--ink); font-family: var(--body); font-size: .95rem;
  border-radius: 2px; outline: none; transition: border-color .2s;
  -webkit-appearance: none;
}
.contact-form input:not([type="checkbox"]):focus,
.contact-form textarea:focus,
.contact-form select:focus { border-color: var(--green-soft); background: #fff; }
.contact-form textarea { height: 130px; resize: vertical; }
.contact-form button {
  background: var(--green-deep); color: #fff; padding: 1rem;

}

.contact-form button:disabled { opacity: .7; cursor: default; transform: none; }
.form-success {

  background: var(--green-mist); border: 1px solid var(--green-light);
  border-radius: 2px; font-family: var(--display); font-style: italic;

}

.info-icon {
  width: 38px; height: 38px; min-width: 38px;

  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: .95rem; flex-shrink: 0;
}

  display: inline-flex; align-items: center; gap: .4rem;

.quote-aside {
  background: var(--green-mist); border: 1px solid var(--green-light);

}
